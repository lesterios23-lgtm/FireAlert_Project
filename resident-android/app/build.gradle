import java.net.DatagramSocket
import java.net.Inet4Address
import java.net.InetAddress
import java.net.NetworkInterface

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The API base URL is never committed as a fixed private IP. Release builds
// must be configured explicitly; debug builds follow the development
// machine's current LAN address so a phone on the same Wi-Fi or hotspot can
// reach the local Laravel server.
def configuredApiBaseUrl = providers.gradleProperty('FIREALERT_API_BASE_URL')
    .orElse(providers.environmentVariable('FIREALERT_API_BASE_URL'))
    .getOrNull()
    ?.trim()

def normalizeApiBaseUrl = { String value ->
    value ? (value.endsWith('/') ? value : "${value}/") : ''
}

def detectLanHost = {
    // Ask the OS which local address the routing table would use for the
    // current connection. No packets are sent and no internet is required.
    try {
        def socket = new DatagramSocket()
        socket.connect(InetAddress.getByName('8.8.8.8'), 53)
        def primary = socket.getLocalAddress()
        socket.close()

        if (primary instanceof Inet4Address && primary.isSiteLocalAddress()) {
            return primary.getHostAddress()
        }
    } catch (Exception ignored) {
        // No active route (for example, an isolated hotspot); fall through.
    }

    // Fall back to enumerating private IPv4 addresses, skipping adapters that
    // phones cannot reach.
    def candidates = []
    def interfaces = NetworkInterface.getNetworkInterfaces()

    while (interfaces != null && interfaces.hasMoreElements()) {
        def iface = interfaces.nextElement()

        try {
            if (!iface.isUp() || iface.isLoopback()) continue

            def label = "${iface.getName()} ${iface.getDisplayName() ?: ''}".toLowerCase(Locale.ROOT)
            if (label.contains('docker') || label.contains('wsl') || label.contains('vmware') ||
                label.contains('virtualbox') || label.contains('vbox') || label.contains('vethernet') ||
                label.contains('hyper-v') || label.contains('tailscale') || label.contains('teredo') ||
                label.contains('host-only')) {
                continue
            }

            def addresses = iface.getInetAddresses()
            while (addresses.hasMoreElements()) {
                def address = addresses.nextElement()
                if (!(address instanceof Inet4Address)) continue
                if (!address.isSiteLocalAddress() || address.isLoopbackAddress() || address.isLinkLocalAddress()) continue

                candidates << [
                    host: address.getHostAddress(),
                    wifi: label ==~ /.*(wi-?fi|wlan|wireless).*/,
                ]
            }
        } catch (IOException ignored) {
            // Interface disappeared while enumerating; skip it.
        }
    }

    // Rank likely phone-reachable addresses first: Windows Mobile Hotspot,
    // then Wi-Fi adapters, then common private ranges.
    def rank = { entry ->
        if (entry.host == '192.168.137.1') return 0
        if (entry.wifi) return 1
        if (entry.host.startsWith('192.168.')) return 2
        if (entry.host.startsWith('10.')) return 3
        return 4
    }

    if (candidates.isEmpty()) return null
    candidates.sort { a, b -> rank(a) <=> rank(b) }
    logger.info("FireAlert LAN candidate addresses: ${candidates*.host}")
    return candidates.first().host
}

def normalizedReleaseApiBaseUrl = normalizeApiBaseUrl(configuredApiBaseUrl)
def detectedLanHost = normalizedReleaseApiBaseUrl ? null : detectLanHost()
def debugApiBaseUrl = normalizedReleaseApiBaseUrl
    ?: (detectedLanHost ? "http://${detectedLanHost}:8000/api/v1/" : 'http://10.0.2.2:8000/api/v1/')

logger.info("FireAlert debug API base URL: ${debugApiBaseUrl}")

// Prints the address a debug build will embed, without assembling the APK.
tasks.register('printDebugApiBaseUrl') {
    doLast {
        println debugApiBaseUrl
    }
}

def verifyReleaseApiConfiguration = tasks.register('verifyReleaseApiConfiguration') {
    doLast {
        if (!normalizedReleaseApiBaseUrl) {
            throw new GradleException(
                'Set FIREALERT_API_BASE_URL to the deployed HTTPS API URL before building a release.'
            )
        }

        def apiUri = new URI(normalizedReleaseApiBaseUrl)
        if (apiUri.scheme != 'https' || !apiUri.host || !apiUri.path.endsWith('/api/v1/')) {
            throw new GradleException(
                'FIREALERT_API_BASE_URL must be an HTTPS URL ending in /api/v1/.'
            )
        }
    }
}

tasks.configureEach {
    if (name ==~ /(?i)(assemble|bundle|package).*release/) {
        dependsOn(verifyReleaseApiConfiguration)
    }
}

android {
    namespace 'com.firealert.resident'
    compileSdk 34

    defaultConfig {
        applicationId "com.firealert.resident"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            buildConfigField 'String', 'FIREALERT_API_BASE_URL', "\"${debugApiBaseUrl}\""
        }
        release {
            minifyEnabled false
            buildConfigField 'String', 'FIREALERT_API_BASE_URL', "\"${normalizedReleaseApiBaseUrl}\""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Retrofit for API calls (like Axios in React)
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    // Google Maps
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
}